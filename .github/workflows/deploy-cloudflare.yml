name: Deploy to Cloudflare Pages

# Every push to main puts the web build on https://cage-legacy.pages.dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site folder
        run: bash tools/make_site.sh
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26f32d8d8bd5e9476b25284e6bd2b28d
        run: npx -y wrangler@4.20.0 pages deploy site --project-name cage-legacy --branch main --commit-dirty=true
